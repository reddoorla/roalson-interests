<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <!-- Atkinson Hyperlegible Next — the design's only licensed face. OFL on
         Google Fonts, which answers the licence question Erik raised on
         2026-09-01. The baseline CSP already allows fonts.googleapis.com
         (style-src) and fonts.gstatic.com (font-src), so this needs no CSP
         change.

         A PLAIN stylesheet link on purpose. The fleet's `media="print"` +
         `onload="this.media='all'"` swap is an inline event handler, and this
         template's script-src grants nonces with no 'unsafe-inline' — a nonce
         never authorises a handler. The sheet would download, `media` would
         stay `print`, and zero faces would apply.

         The range is 200..800, the family's full variable axis, NOT the 400/500/600
         the comp uses. Measured: the css2 responses for `wght@400..600` and
         `wght@200..800` point at the IDENTICAL woff2 file, so widening costs zero
         bytes. A narrowed range only narrows the declared `font-weight` on the
         @font-face, which means any 300 or 700 introduced later is silently
         SYNTHESISED by the browser rather than failing visibly. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap"
    />
    <!-- The no-JS half of the scroll reveal's first-paint hidden state (app.css,
         `[data-reveal]`). With scripting off this style applies and every
         revealed element paints normally; with scripting on the browser ignores
         the whole element, so the hidden state stands and animateIn owns it.
         Content can therefore never be stranded at opacity 0 by a browser that
         was never going to run the reveal — the same guarantee a curl of the
         SSR HTML gives a crawler.

         WHY A STYLE AND NOT AN INLINE `classList.add("js")` SCRIPT: an unhashed
         inline script here is governed by this template's own CSP
         (svelte.config.js `kit.csp`, script-src with no 'unsafe-inline'). On
         prerendered routes it would survive only because the policy ships as a
         <meta> tag emitted after it; on server-rendered routes the policy is an
         HTTP header carrying a nonce, and the script is silently dropped. A
         guard that is live on some routes and dead on others is worse than no
         guard. style-src already allows inline styles, so this half works
         identically everywhere and needs no CSP hash to maintain. -->
    <!-- `[data-js-only]` is the same contract for CONTROLS: an element whose job
         needs script is not shown to a browser that has DECLARED it will never
         run any. Today that is the menu trigger — Nav.svelte renders the
         menu's links into the bar inside its own <noscript>, so hiding the
         trigger costs nobody the navigation.

         What this block cannot see is scripting ON with a bundle that never
         arrives: a browser in that state ignores <noscript> entirely. So a
         control marked `data-js-only` still may not be DEAD in the server's
         markup — the trigger is a link to the footer's list of pages until
         mount swaps it for the button (#19). This rule is the better answer
         for the one case that announces itself, not the only answer. -->
    <!-- `[data-nav-wordmark="gated"]` is `[data-reveal]`'s contract again, for
         the homepage bar's wordmark: the server renders it hidden until the
         hero's cutout has scrolled away (#18, Nav.svelte), and script is what
         measures that. A browser that will never run the measurement is shown
         the wordmark from the start. The attribute is on the REVERSE lockup
         only, and only while the gate holds, so this cannot light a white
         wordmark on a page whose bar is solid. -->
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
        [data-js-only] {
          display: none !important;
        }
        [data-nav-wordmark="gated"] {
          opacity: 1 !important;
        }
      </style>
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- display:contents wrapper per SvelteKit's recommendation: placing the app
         directly inside <body> can break when browser extensions inject nodes. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
