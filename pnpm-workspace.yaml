allowBuilds:
  # migrated from the old onlyBuiltDependencies in package.json
  "@scarf/scarf": false
  protobufjs: true
  sharp: true
  simple-git-hooks: false
minimumReleaseAge: 0

# Transitive-dependency security pins (same idiom as reddoor-maintenance —
# pnpm 11 reads overrides HERE, not package.json).
# Cleared 2026-07-26:
#   - sharp <0.35.0: inherited libvips CVEs (GHSA-f88m-g3jw-g9cj); transitive pin via
#     @zerodevx/svelte-img > vite-imagetools > imagetools-core@6 (^0.33.1) — runtime scope
overrides:
  sharp@<0.35.0: ^0.35.5
  # Cleared 2026-11-05 (P1-101): every critical/high `pnpm audit` reported, prod and dev scope,
  # since the nightly reads Dependabot (both scopes). Each is range-scoped to the vulnerable
  # versions, and each target stays in the major installed today, inside every current parent's
  # declared range, so nothing crosses a major.
  #   - undici >=8.0.0 <8.12.2 (dev, jsdom > undici): GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3,
  #     GHSA-vp8m-p9jh-q5pm, GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx,
  #     GHSA-qrxm-fqhp-jwvm
  #   - brace-expansion >=4.0.0 <5.0.11 (prod, @reddoorla/maintenance > eslint > minimatch): GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  #   - source-map-js >=1.0.0 <1.2.2 (postcss, @tailwindcss/node, vitest): GHSA-68fv-2mgg-jv7q
  # Removed 2026-11-05 with Slice Machine itself (P1-101, the Prismic CLI move), because
  # `pnpm why` found no path left to any of them: proxy-addr, joi, follow-redirects and
  # body-parser (P1-101's own pins), and qs and uuid (2026-07-14), all reached only through
  # slice-machine-ui or @slicemachine/*. The same move cleared zod 3.25.76 (GHSA-mrhx-c7xc-m3w5,
  # slice-machine-ui > @slicemachine/manager > @anthropic-ai/claude-agent-sdk, no 3.x fix) and
  # dropped concurrently, whose shell-quote pin the earlier note here described. If one of these
  # comes back through a new parent, `pnpm audit` reports it again; re-pin it then.
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  "brace-expansion@>=4.0.0 <5.0.11": ^5.0.11
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
