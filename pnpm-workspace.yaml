allowBuilds:
  # migrated from the old onlyBuiltDependencies in package.json
  "@scarf/scarf": false
  protobufjs: true
  sharp: true
  simple-git-hooks: false
minimumReleaseAge: 0

# Transitive-dependency security pins (same idiom as reddoor-maintenance —
# pnpm 11 reads overrides HERE, not package.json). Cleared 2026-07-14:
#   - qs >=6.11.1 <6.15.2: stringify DoS on null comma-format entries (GHSA-q8mj-m7cp-5q26)
#   - uuid <11.1.1: missing buffer bounds check in v3/v5/v6 (GHSA-w5hq-g745-h8pq)
# Cleared 2026-07-26:
#   - sharp <0.35.0: inherited libvips CVEs (GHSA-f88m-g3jw-g9cj); transitive pin via
#     @zerodevx/svelte-img > vite-imagetools > imagetools-core@6 (^0.33.1) — runtime scope
overrides:
  qs@<6.15.2: ">=6.15.2 <7"
  uuid@<11.1.1: ">=11.1.1"
  sharp@<0.35.0: ^0.35.5
  # Cleared 2026-11-05 (P1-101): every critical/high `pnpm audit` reported, prod and dev scope,
  # since the nightly reads Dependabot (both scopes). Each is range-scoped to the vulnerable
  # versions and capped at the major the parent already asks for, so nothing crosses a major.
  #   - undici >=8.0.0 <8.12.2 (dev, jsdom > undici): GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3,
  #     GHSA-vp8m-p9jh-q5pm, GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx,
  #     GHSA-qrxm-fqhp-jwvm
  #   - brace-expansion >=4.0.0 <5.0.11 (eslint > minimatch): GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7
  #   - source-map-js >=1.0.0 <1.2.2 (postcss, @tailwindcss/node, vitest): GHSA-68fv-2mgg-jv7q
  #   - proxy-addr >=1.1.0 <2.0.8 (dev, slice-machine-ui > express), critical: GHSA-jqcg-44mw-7w3h
  #   - shell-quote >=1.8.4 <1.11.0 (dev, concurrently), critical: GHSA-pqg4-j6r4-53mv
  #   - joi >=17.1.1 <17.13.9 (dev, slice-machine-ui, @slicemachine/plugin-kit): GHSA-6h2x-m376-mqjq,
  #     GHSA-4528-x5fx-h6hg
  #   - follow-redirects >=1.16.0 <1.16.2 (dev, slice-machine-ui > http-proxy): GHSA-q3jh-wrc6-jgq8,
  #     GHSA-8r9p-f939-6h3c, GHSA-mrwp-f3q8-3g9p
  #   - body-parser <1.20.9 (dev, slice-machine-ui > express): GHSA-27r3-jxmh-p828
  # Not here: zod <4.6.6 (GHSA-mrhx-c7xc-m3w5, dev, slice-machine-ui > @slicemachine/manager >
  # @anthropic-ai/claude-agent-sdk@0.1.37, peer zod ^3). No 3.x fix exists, so it is a decision
  # file in reddoor-workspace, not an override.
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  "brace-expansion@>=4.0.0 <5.0.11": ^5.0.11
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
  "proxy-addr@>=1.1.0 <2.0.8": ^2.0.8
  "shell-quote@>=1.8.4 <1.11.0": ^1.11.0
  "joi@>=17.1.1 <17.13.9": ^17.13.9
  "follow-redirects@>=1.16.0 <1.16.2": ^1.16.2
  "body-parser@<1.20.9": ^1.20.9
