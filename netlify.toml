[build]
    command = "pnpm run build"
    publish = "build/"

[build.environment]
    NODE_VERSION = "24"

# Baseline security headers for all responses. CSP is emitted per-response by
# SvelteKit (see `kit.csp` in svelte.config.js) so it is intentionally omitted
# here to avoid conflicting duplicates.
[[headers]]
    for = "/*"
    [headers.values]
        Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
        X-Content-Type-Options = "nosniff"
        X-Frame-Options = "SAMEORIGIN"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
        Cross-Origin-Opener-Policy = "same-origin"

# The icons (#4). NOT `immutable`: that is a promise the bytes at a path will
# never change, and it is only true for a path that carries a content hash.
# `/favicon.png` was pinned immutable for a year, so correcting the SvelteKit
# skeleton icon in place would have left returning visitors on it until 2027 —
# which is why the fix ships under these paths and not that one. A week bounds
# the same mistake to a week the next time a client revises their mark.
[[headers]]
    for = "/favicon.svg"
    [headers.values]
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "/favicon-32.png"
    [headers.values]
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "/apple-touch-icon.png"
    [headers.values]
        Cache-Control = "public, max-age=604800"

[[headers]]
    for = "/_app/immutable/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"
